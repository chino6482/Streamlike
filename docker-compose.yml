services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamlike
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: streamlike
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "streamlike"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:2.3
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DISABLE_CORS_CHECKS=1
      - EXTRA_CORS_ALLOWED_ORIGINS=*
      - S3_BUCKET=${S3_BUCKET:-streamlike-bucket}
    ports:
      - "4566:4566"
    volumes:
      # Crea el bucket S3 automáticamente al arrancar (hooks "ready" de LocalStack)
      - ./localstack/init:/etc/localstack/init/ready.d
      # Persiste los objetos S3 entre reinicios del contenedor
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      localstack:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Se incrustan en build-time (deben existir también al construir la imagen)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_KEY: ${API_KEY:-}
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started
    ports:
      - "3001:3000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    # DNS saliente explícito (restauración: el resolver embebido 127.0.0.11 no
    # resolvía hosts externos en este entorno). Necesario para descargar videos
    # desde enlaces (ffmpeg HTTP).
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      localstack:
        condition: service_healthy

volumes:
  pgdata:
  localstack_data:
